name: MiniMax Auto Coder

on:
  issues:
    types: [labeled]

jobs:
  auto-code:
    if: github.event.label.name == 'ai-write'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run MiniMax Agent
        env:
          # 【核心修改 1】Aider 底层依赖 LiteLLM，LiteLLM 识别 MiniMax 必须使用 MINIMAX_API_KEY 这个变量名
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="ai-feature-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 【核心修改 2】模型前缀必须严格写成 minimax/ 后面接模型代号，并加上跳过警告的参数
          aider --model minimax/MiniMax-M2.7 --message "根据需求编写或修改代码。标题：$ISSUE_TITLE。描述：$ISSUE_BODY" --no-show-model-warnings --yes
          
          git push origin $BRANCH_NAME
          
          gh pr create --title "AI(MiniMax): ${{ github.event.issue.title }}" --body "这是 MiniMax 自动为你生成的代码，请审核。" --base main --head $BRANCH_NAME
