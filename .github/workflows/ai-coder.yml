name: DeepSeek V4 Flash Auto Coder

on:
  issues:
    types: [labeled]

jobs:
  auto-code:
    if: github.event.label.name == 'ai-write'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run DeepSeek Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="ai-feature-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 【核心修改】这里模型名字已经完美替换为 deepseek/deepseek-v4-flash
          aider --model deepseek/deepseek-v4-flash --message "根据需求编写或修改代码。标题：$ISSUE_TITLE。描述：$ISSUE_BODY" --no-show-model-warnings --yes
          
          git push origin $BRANCH_NAME
          
          gh pr create --title "AI(DeepSeek-V4-Flash): ${{ github.event.issue.title }}" --body "这是 DeepSeek V4 Flash 自动为你生成的代码，请审核。" --base main --head $BRANCH_NAME
