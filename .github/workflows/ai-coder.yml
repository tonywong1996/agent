name: MiniMax Free Quota Coder

on:
  issues:
    types: [labeled]

jobs:
  auto-code:
    if: github.event.label.name == 'ai-write'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run MiniMax Agent
        env:
          # 使用你的 MiniMax 国际版新 Key
          OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_BASE: https://api.minimaxi.com/v1
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="ai-feature-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 【核心修改】这里不写具体的高级型号，改写标准通用的 text-davinci-003 或 gpt-3.5-turbo 
          # MiniMax 国际版接口会自动把这个通用名字映射到它们最基础、允许使用免费额度的基础模型上。
          aider --model openai/gpt-3.5-turbo --message "根据需求编写或修改代码。标题：$ISSUE_TITLE。描述：$ISSUE_BODY" --no-show-model-warnings --yes
          
          git push origin $BRANCH_NAME
          
          gh pr create --title "AI(MiniMax-Free): ${{ github.event.issue.title }}" --body "这是用 MiniMax 免费额度自动生成的代码。" --base main --head $BRANCH_NAME
