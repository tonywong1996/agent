name: MiniMax Auto Coder

on:
  issues:
    types: [labeled]

jobs:
  auto-code:
    if: github.event.label.name == 'ai-write'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run MiniMax Agent
        env:
          OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_BASE: https://api.minimax.io/v1
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="ai-feature-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 唤醒 AI Agent 
          aider --model openai/MiniMax-M2.7 --message "根据需求编写或修改代码。标题：$ISSUE_TITLE。描述：$ISSUE_BODY" --yes
          
          git push origin $BRANCH_NAME
          
          gh pr create --title "AI(MiniMax): ${{ github.event.issue.title }}" --body "这是 MiniMax 自动为你生成的代码，请审核。" --base main --head $BRANCH_NAME
